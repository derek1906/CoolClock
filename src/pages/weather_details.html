<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cool Clock Weather</title>
    <style>
      @font-face {
        font-family: Roboto;
        src: url('/fonts/Roboto-Regular.ttf');
      }
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font:
          16px Roboto,
          Arial,
          sans-serif;
        color: #17324e;
        background: linear-gradient(145deg, #073975, #0daee6);
        min-height: 100vh;
      }
      main {
        max-width: 720px;
        margin: 40px auto;
        padding: 28px;
        background: white;
        border-radius: 14px;
        box-shadow: 0 12px 40px #06345d66;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 10px;
      }
      #current {
        font-size: 22px;
        margin: 16px 0 24px;
      }
      #forecast {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
        gap: 10px;
      }
      .day {
        padding: 14px;
        border: 1px solid #d6e4ef;
        border-radius: 10px;
      }
      .day strong,
      .day span {
        display: block;
        margin-bottom: 8px;
      }
      #status {
        color: #a33;
      }
      footer {
        margin-top: 24px;
        font-size: 13px;
        color: #566;
      }
      footer a {
        color: #096993;
      }
      @media (max-width: 700px) {
        main {
          margin: 10px;
          padding: 20px;
        }
      }
    </style>
    <script src="/mv3/locale_catalog.js" defer></script>
    <script src="/mv3/i18n.js" defer></script>
    <script src="/mv3/device_location.js" defer></script>
    <script src="/scripts/weather_details/js.js" defer></script>
  </head>
  <body>
    <main>
      <h1 id="city">Weather</h1>
      <div id="current"></div>
      <p id="status"></p>
      <div id="forecast"></div>
      <footer>
        Weather data:
        <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
      </footer>
    </main>
  </body>
</html>
